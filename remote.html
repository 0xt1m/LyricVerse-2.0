<!doctype html>
<html lang="uk" data-window="remote">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` so the page reaches under a phone's rounded
         corners and home bar; the layout pads itself back out with the safe
         area insets. `user-scalable=no` because a mis-hit on a control that
         zooms the page mid-service is worse than the accessibility it costs —
         every target here is already finger-sized. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0c0f" />
    <!-- Added to a home screen, it opens as an app rather than in a tab. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>LyricVerse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/remote/main.tsx"></script>
  </body>
</html>
