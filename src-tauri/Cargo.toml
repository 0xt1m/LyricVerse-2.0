[package]
name = "lyricverse"
version = "2.2.3"
description = "Song & Scripture presentation for worship services"
authors = ["LyricVerse"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lyricverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fetching the translations offered on lyricverse.app. The features match the
# ones the updater already turns on, so cargo unifies them and this costs no
# extra compilation — and rustls rather than the platform's TLS means a build
# still needs no OpenSSL anywhere.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider", "json", "stream",
] }
# The provider behind that TLS. Installed explicitly at startup rather than
# left to whichever dependency happens to get there first.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false }
# Checking a downloaded module against the checksum the catalogue gives.
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
regex = "1"
base64 = "0.22"
# Decoders for the formats a webview cannot render itself (TIFF, TGA, ICO…);
# web-safe files are copied untouched rather than re-encoded.
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi", "pnm", "tga",
] }

# Raising a projection window above the macOS menu bar, which is drawn over
# ordinary windows — including always-on-top ones. Nothing else needs it, so
# it is only pulled in on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
# Only for the network test in `catalog.rs`, which is `#[ignore]`d.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
