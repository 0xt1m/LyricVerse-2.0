[package]
name = "lyricverse"
version = "2.1.3"
description = "Song & Scripture presentation for worship services"
authors = ["LyricVerse"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lyricverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
regex = "1"
base64 = "0.22"
# Decoders for the formats a webview cannot render itself (TIFF, TGA, ICO…);
# web-safe files are copied untouched rather than re-encoded.
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi", "pnm", "tga",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
