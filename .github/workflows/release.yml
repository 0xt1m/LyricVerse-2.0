# Builds and publishes a release when a version tag is pushed.
#
#   # bump `version` in src-tauri/Cargo.toml first — it is the only place
#   # the version is written, and the tag must agree with it
#   git tag v2.1.0 && git push origin v2.1.0
#
# Each runner builds its own installers, signs the update artifact with the
# private key held in repository secrets, and uploads everything to one draft
# release. `tauri-action` also writes the `latest.json` the app checks on
# startup, so publishing the draft is what actually offers the update.
#
# The signing key never lives in the repository. Set these secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.lyricverse/updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty if none was set)

name: Release

on:
  push:
    tags: ["v*"]
  # So a build can be checked without cutting a release.
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon and Intel are separate builds; a universal binary
          # would work too but doubles the download for every machine.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # The tag is only a label; the version that ends up in the app and in
      # latest.json comes from Cargo.toml. If the two disagree, the release is
      # filed under one number while the app reports another — and the updater
      # compares against the app's. Cheaper to fail here than to work that out
      # from a congregation's machine that will not update.
      - name: Tag must match the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $crate | tag: $tag"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      # Tauri needs webkit2gtk and the AppIndicator libraries on Linux; the
      # runner image has neither. Pinned to 22.04 above because 24.04 ships
      # webkit2gtk-4.1 under a different package name.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ship no songbooks and no Bible translations. They belong to a
          # congregation, not to the program, and much of that text may not be
          # redistributed. A fresh install is filled from Settings.
          LYRICVERSE_EMPTY_SEED: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LyricVerse ${{ github.ref_name }}
          releaseBody: "Bible translations, songbooks and settings are kept outside the app, so updating never touches them."
          # Left as a draft on purpose: the update is not offered to anyone
          # until every platform has finished and somebody has looked at it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
