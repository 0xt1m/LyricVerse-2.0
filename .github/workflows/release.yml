# Builds and publishes a release when a version tag is pushed.
#
#   # bump `version` in src-tauri/Cargo.toml first — it is the only place
#   # the version is written, and the tag must agree with it
#   git tag v2.1.0 && git push origin v2.1.0
#
# Each runner builds its own installers, signs the update artifact with the
# private key held in repository secrets, and uploads everything to one draft
# release. `tauri-action` also writes the `latest.json` the app checks on
# startup, so publishing the draft is what actually offers the update.
#
# No key ever lives in the repository. Set these secrets:
#
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.lyricverse/updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty if none was set)
#
# And, for macOS builds Gatekeeper will accept — without them the Mac
# installers still build, but unsigned, and every user is told the app is
# damaged:
#
#   APPLE_CERTIFICATE           `openssl base64 -A -in DeveloperID.p12`
#   APPLE_CERTIFICATE_PASSWORD  the password used when exporting that .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   APPLE_API_ISSUER            App Store Connect → Integrations, above the keys
#   APPLE_API_KEY               that key's Key ID
#   APPLE_API_KEY_P8            contents of the AuthKey_<KEYID>.p8 file
#
# The last one is written to a file below because the notary tool takes a
# path, not the key itself.

name: Release

on:
  push:
    tags: ["v*"]
  # So a build can be checked without cutting a release.
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon and Intel are separate builds; a universal binary
          # would work too but doubles the download for every machine.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    # Job level, not step level: a step's own `env:` is not visible to that
    # step's `if:`, and the notarisation step has to be able to ask whether
    # there is a key before it writes one.
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # The tag is only a label; the version that ends up in the app and in
      # latest.json comes from Cargo.toml. If the two disagree, the release is
      # filed under one number while the app reports another — and the updater
      # compares against the app's. Cheaper to fail here than to work that out
      # from a congregation's machine that will not update.
      - name: Tag must match the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $crate | tag: $tag"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      # Tauri needs webkit2gtk and the AppIndicator libraries on Linux; the
      # runner image has neither. Pinned to 22.04 above because 24.04 ships
      # webkit2gtk-4.1 under a different package name.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Only on the Mac runners, and only once the secret exists — a build run
      # before they are configured should still produce installers rather than
      # failing outright. `if:` cannot read the secrets context, so the key
      # comes through the environment.
      - name: Prepare the notarisation key
        if: matrix.platform == 'macos-latest' && env.APPLE_API_KEY_P8 != ''
        shell: bash
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_$APPLE_API_KEY.p8
          chmod 600 ~/private_keys/AuthKey_$APPLE_API_KEY.p8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing and notarising the Mac builds. `tauri-action` installs the
          # certificate into a temporary keychain of its own, so nothing is
          # left behind on the runner.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          # Keep the builder's own songbooks and translations out of the
          # installers. They belong to a congregation, not to the program, and
          # much of that text may not be redistributed.
          #
          # What everybody does get is `seed-default/` — the small library
          # chosen to go out, which is in git and is unaffected by this.
          LYRICVERSE_EMPTY_SEED: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LyricVerse ${{ github.ref_name }}
          releaseBody: "Bible translations, songbooks and settings are kept outside the app, so updating never touches them."
          # Left as a draft on purpose: the update is not offered to anyone
          # until every platform has finished and somebody has looked at it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
